name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-preview.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Unique stable version tag (for example v1.0.1)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || 'v1.0.0' }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure requested tag matches application version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Normal releases require semantic version tags such as v1.0.0."
          }
          [xml] $project = Get-Content "MDBStudio/MDBStudio.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$projectVersion") {
            throw "Release tag $env:RELEASE_TAG does not match application version v$projectVersion."
          }
          $source = Get-Content "MDBStudio/UpdateChecker.cs" -Raw
          if (-not $source.Contains('CurrentReleaseTag = "' + $env:RELEASE_TAG + '"')) {
            throw "Update checker release tag must match the project version."
          }
      - name: Restore dependencies
        run: dotnet restore MDBStudio/MDBStudio.csproj
      - name: Compile
        run: dotnet build MDBStudio/MDBStudio.csproj --configuration Release --no-restore
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish MDBStudio/MDBStudio.csproj -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }
          if (-not (Test-Path "publish/MDBStudio.exe")) { throw "MDBStudio.exe missing." }
          (Get-FileHash "publish/MDBStudio.exe" -Algorithm SHA256).Hash + "  MDBStudio.exe" | Set-Content "publish/SHA256.txt" -Encoding ascii
      - name: Package and publish standard GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $file = "MDBStudio-Windows-x64-$tag.zip"
          Compress-Archive -Path "publish\*" -DestinationPath $file -CompressionLevel Optimal -Force
          if (-not (Test-Path $file)) { throw "Release ZIP missing." }
          $notes = @(
            "# MDB Studio $tag"
            ""
            "Standard Windows release, published from the C# and WPF source in this repository."
            ""
            "Includes the redesigned MDB Studio interface and app icon, MDB/ACCDB database browsing, large-table navigation, record copy/paste, duplication and deletion controls, read-only SQL, backups, full-table CSV export and Check updates."
            ""
            "The ZIP is a portable application folder, not an installer. Extract all files together and launch MDBStudio.exe."
            ""
            "Windows runtime and antivirus certification have not been independently completed. This executable is not code-signed. Earlier unrelated experimental Go executables were flagged by Defender; never disable antivirus protection or override a threat warning to run MDB Studio."
            ""
            "Work on backups of important databases. This is not a feature-complete Microsoft Access replacement."
            ""
            "Includes SHA256.txt for the executable. Built from commit $env:GITHUB_SHA."
          )
          $notes | Set-Content "RELEASE_NOTES.md" -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists. Published versions must not be overwritten."
          }
          gh release create $tag $file --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MDB Studio $tag" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publishing failed." }
